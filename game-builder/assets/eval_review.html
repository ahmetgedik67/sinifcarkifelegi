<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Eval Review</title>
  <style>
    :root {
      --bg: #0a0a2e;
      --bg-secondary: #1a1a4e;
      --fg: #e0e0ff;
      --muted: #7a7aae;
      --accent: #bb00ff;
      --danger: #ff0066;
      --success: #39ff14;
      --card: #16163a;
      --border: #2a2a5a;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      min-height: 100vh;
    }

    .orbitron { font-family: 'Orbitron', sans-serif; }

    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      color: var(--fg);
      margin: 0;
    }

    .header p {
      color: var(--muted);
      margin: 8px 0 0;
      font-size: 0.9rem;
    }

    .eval-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 20px;
    }

    .eval-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .eval-header {
      background: var(--bg-secondary);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .eval-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .eval-status {
      float: right;
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-yes { background: rgba(57, 255, 20, 0.2); color: var(--success); }
    .status-no { background: rgba(255, 0, 102, 0.2); color: var(--danger); }

    .eval-body {
      padding: 20px;
    }

    .eval-query {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      white-space: pre-wrap;
      min-height: 80px;
    }

    .toggle-yes {
      background: rgba(57, 255, 20, 0.3);
      border: 1px solid var(--success);
      color: var(--success);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      margin-right: 4px;
    }

    .toggle-no {
      background: rgba(255, 0, 102, 0.3);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-top: 24px;
    }

    .controls h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      color: var(--fg);
      margin: 0 0 16px;
    }

    .toggle-group {
      display: flex;
      gap: 8px;
      margin: 8px 0;
    }

    .toggle {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 8px;
      font-size: 0.75rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 6px;
      cursor: pointer;
    }

    .toggle.active {
      background: var(--accent);
      color: var(--bg);
    }

    .btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 8px 16px;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      margin: 4px;
      font-family: inherit;
    }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--fg);
      border: 1px solid var(--border);
    }

    .export-msg {
      margin-top: 20px;
      padding: 12px;
      background: rgba(57, 255, 20, 0.1);
      border: 1px solid var(--success);
      border-radius: 8px;
      color: var(--success);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Skill Eval Review: game-builder</h1>
      <p>Current description: <span id="current-desc" class="orbitron"></span></p>
    </div>

    <div class="eval-grid" id="eval-grid">
      <!-- Eval cards generated by JS -->
    </div>

    <div class="controls">
      <h2>Optimization Controls</h2>
      <div class="toggle-group">
        <div class="toggle active" data-toggle="yes">Should Trigger</div>
        <div class="toggle" data-toggle="no">Should Not Trigger</div>
      </div>
      <button class="btn btn-secondary" id="export-btn">Export Eval Set</button>
      <div class="export-msg" id="export-msg" style="display: none;">Eval set exported to ~/Downloads/eval_set.json</div>
    </div>
  </div>

  <script>
    // Eval data from the trigger-evals.json
    const evalData = [
      {"query": "Create a Blooket-style game with Tower Defense and Racing modes, pin code, and avatar selection for players to join", "should_trigger": true},
      {"query": "Build a quiz game admin panel with pin code generation and mode selection similar to Kahoot", "should_trigger": true},
      {"query": "Make a game where players enter with nicknames and select avatars before joining a quiz game", "should_trigger": true},
      {"query": "Design a game mode selection screen with pin codes for player participation", "should_trigger": true},
      {"query": "I need a Kahoot-like interface with nickname entry and avatar choices", "should_trigger": true},
      {"query": "Create something like Blooket with game modes and pin codes for my class", "should_trigger": true},
      {"query": "Build an admin panel for a quiz game with mode filtering and player login", "should_trigger": true},
      {"query": "Set up a live game mode selection with pin code display and avatar options", "should_trigger": true},
      {"query": "ok so my boss just sent me this xlsx file (its in my downloads, called something like 'Q4 sales final FINAL v2.xlsx') and she wants me to add a column that shows the profit margin as a percentage. The revenue is in column C and costs are in column D i think", "should_trigger": false},
      {"query": "Format this data and make it look presentable", "should_trigger": false},
      {"query": "Extract text from the PDF and put it in a table", "should_trigger": false},
      {"query": "Create a presentation about sales data for the quarterly review", "should_trigger": false},
      {"query": "Write a report on Q4 performance metrics and send it to the team", "should_trigger": false},
      {"query": "Calculate the average of these numbers and give me the result", "should_trigger": false},
      {"query": "Format my CSV file with proper headers", "should_trigger": false},
      {"query": "Sort this list of names alphabetically and remove duplicates", "should_trigger": false},
      {"query": "What's the weather like today?", "should_trigger": false},
      {"query": "Tell me a joke about dinosaurs", "should_trigger": false},
      {"query": "Help me plan a surprise party for my friend", "should_trigger": false}
    ];

    const skillName = "game-builder";
    const skillDesc = "Build Blooket- and Kahoot-style quiz games with admin panels, pin codes, player login, nickname and avatar selection, and game options. Trigger this skill whenever the user mentions building a quiz game, quiz interface, game mode selection, or anything resembling Blooket/Kahoot.";

    // Render eval cards
    const evalGrid = document.getElementById('eval-grid');

    evalData.forEach((eval, idx) => {
      const statusClass = eval.should_trigger ? 'status-yes' : 'status-no';
      const statusText = eval.should_trigger ? 'Yes' : 'No';
      const toggleClass = eval.should_trigger ? 'toggle-yes' : 'toggle-no';
      const toggleText = eval.should_trigger ? 'Should Trigger' : 'Should Not Trigger';

      const card = document.createElement('div');
      card.className = 'eval-card';
      card.innerHTML = `
        <div class="eval-header">
          <span class="eval-title">Eval ${idx}</span>
          <span class="eval-status ${statusClass}">${statusText}</span>
        </div>
        <div class="eval-body">
          <div class="eval-query">${eval.query}</div>
          <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);">
            <span class="toggle ${eval.should_trigger ? 'active' : ''}" data-index="${idx}" data-toggle="yes">Should Trigger</span>
            <span class="toggle ${!eval.should_trigger ? 'active' : ''}" data-index="${idx}" data-toggle="no">Should Not Trigger</span>
          </div>
        </div>
      `;
      evalGrid.appendChild(card);
    });

    // Toggle functionality
    document.querySelectorAll('.toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        const idx = parseInt(toggle.dataset.index);
        evalData[idx].should_trigger = toggle.dataset.toggle === 'yes';

        document.querySelectorAll('.toggle').forEach(t => {
          t.classList.toggle('active', parseInt(t.dataset.index) === idx && t.dataset.toggle === toggle.dataset.toggle);
        });

        toggle.classList.toggle('active', toggle.dataset.toggle === 'yes');
      });
    });

    // Update skill description display
    document.getElementById('current-desc').textContent = skillDesc;

    // Export functionality
    document.getElementById('export-btn').addEventListener('click', () => {
      const exportData = {
        skillName: skillName,
        skillDescription: skillDesc,
        evals: evalData
      };

      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'eval_set.json';
      a.click();

      URL.revokeObjectURL(url);
      document.getElementById('export-msg').style.display = 'block';

      setTimeout(() => {
        document.getElementById('export-msg').style.display = 'none';
      }, 3000);
    });
  </script>
</body>
</html>
